name: بناء الحزم ونشر الإصدار

# يُشغَّل عند دفع وسم يبدأ بـ v (مثال: v26.9.0) أو يدوياً من صفحة Actions.
# ينتج APK موقَّعاً لكلّ معماريّة، وحزمة universal لمن لا يعرف معماريّة جهازه.
#
# الأسرار المطلوبة في إعدادات المستودع (Settings ← Secrets ← Actions):
#   GMD_KEYSTORE_BASE64    ملفّ .jks مُرمَّزاً بـ base64
#   GMD_KEYSTORE_PASSWORD  كلمة سرّ المخزن
#   GMD_KEY_ALIAS          اسم المفتاح المستعار
#   GMD_KEY_PASSWORD       كلمة سرّ المفتاح
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'نشر الإصدار كتجريبيّ'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: بناء الحزم
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: تطابق الوسم مع رقم الإصدار
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VN="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VN" != "$TAG" ]; then
            echo "الوسم v$TAG لا يطابق versionName ($VN)"; exit 1
          fi
          echo "الوسم ورقم الإصدار متطابقان: $VN"

      - name: تطابق الترجمة بين العربيّة والإنجليزيّة
        run: |
          ar=$(grep -oP '(?<=<string name=")[^"]+' app/src/main/res/values-ar/strings.xml | sort)
          en=$(grep -oP '(?<=<string name=")[^"]+' app/src/main/res/values/strings.xml | sort)
          if [ "$ar" != "$en" ]; then
            echo "مفاتيح الترجمة غير متطابقة:"; diff <(echo "$ar") <(echo "$en") || true; exit 1
          fi
          echo "الترجمة متطابقة: $(echo "$ar" | wc -l) مفتاحاً في اللغتين"

      - name: التحقّق من الأرقام المغربيّة 0-9
        run: |
          if grep -rlP '[\x{0660}-\x{0669}]' app/src/main/res app/src/main/java README.md 2>/dev/null; then
            echo "وُجدت أرقام مشرقيّة ١-٩ — استعمل الأرقام المغربيّة 0-9"; exit 1
          fi
          echo "لا أرقام مشرقيّة"

      - name: استعادة مفتاح التوقيع
        env:
          KEYSTORE_B64: ${{ secrets.GMD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "السرّ GMD_KEYSTORE_BASE64 غير مضبوط — لا يمكن إنتاج حزمة قابلة للتثبيت"
            exit 1
          fi
          # خارج شجرة العمل حتّى لا يلتقطه أرشيفٌ أو ذاكرةُ تخزينٍ مؤقّتة
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gmd-release.jks"
          echo "GMD_KEYSTORE_FILE=$RUNNER_TEMP/gmd-release.jks" >> "$GITHUB_ENV"

      - name: بناء الحزم الموقَّعة
        env:
          GMD_KEYSTORE_PASSWORD: ${{ secrets.GMD_KEYSTORE_PASSWORD }}
          GMD_KEY_ALIAS: ${{ secrets.GMD_KEY_ALIAS }}
          GMD_KEY_PASSWORD: ${{ secrets.GMD_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: التحقّق من التوقيع
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          shopt -s nullglob
          found=0
          for apk in app/build/outputs/apk/release/*.apk; do
            found=1
            echo "── $(basename "$apk")"
            "$BT/apksigner" verify --print-certs "$apk" | grep -E 'Signer #1 certificate (DN|SHA-256)'
          done
          [ "$found" = 1 ] || { echo "لم تُنتَج أيّ حزمة"; exit 1; }

      - name: مجاميع التحقّق
        working-directory: app/build/outputs/apk/release
        run: |
          shopt -s nullglob
          for f in *.apk; do sha256sum "$f" >> SHA256SUMS.txt; done
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: gmd-phone-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: نشر الإصدار
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: استخراج ملاحظات الإصدار من CHANGELOG
        id: notes
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## \[/     { exit }
            inside                 { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "الإصدار $VER" > RELEASE_NOTES.md
          fi
          {
            echo
            echo "### أيّ حزمة أنزّل؟"
            echo
            echo "| الحزمة | لمن |"
            echo "|---|---|"
            echo "| \`arm64-v8a\` | أغلب هواتف اليوم |"
            echo "| \`armeabi-v7a\` | هواتف قديمة 32-بت |"
            echo "| \`x86_64\` | المحاكيات وبعض الأجهزة اللوحيّة |"
            echo "| \`universal\` | إن لم تعرف معماريّة جهازك — أكبر حجماً |"
            echo
            echo "---"
            echo
            echo "نسخة الحاسوب (غنو/لينكس) تصدر من مستودعها:"
            echo "https://github.com/SalehGNUTUX/GMD/releases"
          } >> RELEASE_NOTES.md
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: إنشاء الإصدار
        uses: softprops/action-gh-release@v2
        with:
          name: GMD لأندرويد ${{ steps.notes.outputs.version }}
          body_path: RELEASE_NOTES.md
          prerelease: true
          files: artifacts/**
          fail_on_unmatched_files: true
